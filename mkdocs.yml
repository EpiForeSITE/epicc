site_name: EPICC documentation
site_description: Documentation for EPICC, the Epidemiological Cost Calculator.
# The app is served at the site root; this documentation is published under /docs/.
site_url: https://epiforesite.github.io/epicc/docs/
repo_url: https://github.com/EpiForeSITE/epicc
repo_name: EpiForeSITE/epicc
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Versions are published by scripts/deploy_docs.sh with mike: one folder per release,
# `latest` (where /docs/ lands) and `dev` (main). Pages that are not the latest
# release or dev show a banner pointing to the latest.
extra:
  version:
    provider: mike
    default:
      - latest
      - dev

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

# Fail on broken links and missing pages instead of warning. CI builds with --strict.
validation:
  nav:
    # The generated model pages are reached from models/index.md rather than listed
    # one by one here, so new models need no edit to this file.
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Using the app:
      - Sharing links: sharing-links.md
      - Branding and themes: branding.md
  - Models: models/index.md
  - Development:
      - development.md
      - Versioning and releases: versioning.md
  - User stories: stories.md
